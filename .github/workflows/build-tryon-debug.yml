name: Build try-on test APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app-addons/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sync-www.js'
      - '.github/workflows/build-tryon-debug.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          path: rustore-app

      - name: Checkout web application
        uses: actions/checkout@v4
        with:
          repository: ugadaynet-prog/mani-magic
          ref: preview/graphite-20260912
          path: app

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rustore-app/package-lock.json

      - name: Install dependencies
        working-directory: rustore-app
        run: npm ci

      - name: Sync web assets and Capacitor
        working-directory: rustore-app
        run: |
          node sync-www.js
          npx cap sync android

      - name: Copy model to Android assets
        working-directory: rustore-app
        run: |
          mkdir -p android/app/src/main/assets/models
          cp www/tryon/nail-unet.onnx android/app/src/main/assets/models/nail-unet.onnx

      - name: Verify model integrity
        working-directory: rustore-app
        run: |
          echo "70441dd0b34a5d567a93a7870a118c76a4842d1ee6c658d0307650624305580e  www/tryon/nail-unet.onnx" | sha256sum --check
          echo "70441dd0b34a5d567a93a7870a118c76a4842d1ee6c658d0307650624305580e  android/app/src/main/assets/models/nail-unet.onnx" | sha256sum --check
      - name: Build debug APK
        working-directory: rustore-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Verify installable preview package and bundled content
        working-directory: rustore-app/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" > preview-package.txt
          grep "package: name='app.manimagic.rustore.preview'" preview-package.txt
          grep "application-label:'MANI Magic Preview'" preview-package.txt
          unzip -p "$APK" assets/public/experience.js | grep -q 'maniMagicPolls'
          unzip -p "$APK" assets/public/diary-store.js | grep -q 'maniMagicDiary'
          unzip -p "$APK" assets/public/preview-build.js | grep -q 'buy.disabled = true'
          unzip -p "$APK" assets/public/tryon/experience-tryon.css | grep -q 'tryon-nav'
          unzip -p "$APK" assets/models/nail-unet.onnx | sha256sum | grep '^70441dd0b34a5d567a93a7870a118c76a4842d1ee6c658d0307650624305580e'
          sha256sum "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mani-magic-graphite-preview-apk
          path: rustore-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
