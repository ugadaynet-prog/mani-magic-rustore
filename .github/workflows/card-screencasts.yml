name: Скринкасты «Карта дня» (видео-слой A для Reels/TikTok/VK Клипы)

# Записывает короткое вертикальное видео (9:16) реального взаимодействия с
# приложением для каждой карты: открытие карты по прямой ссылке ?card=N →
# флип к фразе → (если есть) галерея примеров работ.
#
# Почему через ?card=N на боевом сайте, а не локальный рендер HTML (как в
# daily-cards.yml): это НАСТОЯЩЕЕ приложение, тот же код, что видит
# пользователь — и именно эта ссылка в приложении СОЗНАТЕЛЬНО не блокируется
# пейволлом (см. комментарий в app/script.js рядом с ?card=N), то есть
# показывает реальную карту у любой из 49, включая платные.
#
# Запросы к Яндекс.Метрике блокируются на время записи, чтобы автоматические
# прогоны не попадали в боевую аналитику (счётчик 111151437) как настоящие
# события card_draw.

on:
  workflow_dispatch:
    inputs:
      cards:
        description: 'Какие карты записать (например "1-49" или "1,5,12")'
        required: false
        default: '1-49'

jobs:
  screencasts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить Playwright с Chromium
        run: |
          npm init -y >/dev/null
          npm i -D playwright@latest >/dev/null
          npx playwright install chromium --with-deps

      - name: Записать видео по каждой карте
        env:
          CARD_RANGE: ${{ inputs.cards }}
        run: |
          mkdir -p raw mp4
          cat > record.js <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const RANGE = process.env.CARD_RANGE || '1-49';
          function parseRange(r) {
            const nums = new Set();
            r.split(',').forEach((part) => {
              part = part.trim();
              if (!part) return;
              const m = part.match(/^(\d+)-(\d+)$/);
              if (m) { for (let i = +m[1]; i <= +m[2]; i++) nums.add(i); }
              else { nums.add(+part); }
            });
            return Array.from(nums).sort((a, b) => a - b);
          }
          const cards = parseRange(RANGE);
          console.log('карт к записи:', cards.length, '→', cards.join(','));

          const BASE = 'https://mani-magic.ru/app/';

          (async () => {
            const browser = await chromium.launch();
            let ok = 0, fail = 0;

            for (const n of cards) {
              const num = String(n).padStart(2, '0');
              try {
                console.log('--- карта', num, '---');
                const context = await browser.newContext({
                  viewport: { width: 1080, height: 1920 },
                  recordVideo: { dir: 'raw', size: { width: 1080, height: 1920 } },
                });
                // Не шлём реальные хиты в боевую Яндекс.Метрику при автозаписи.
                await context.route(/mc\.yandex\./, (route) => route.abort());

                const page = await context.newPage();
                await page.goto(BASE + '?card=' + n, { waitUntil: 'load', timeout: 30000 });

                // Заставка держится минимум 1800мс + 500мс на исчезновение — ждём с запасом.
                await page.waitForTimeout(2800);

                // Открыть карту (флип к фразе на рубашке).
                await page.click('#card').catch(() => {});
                await page.waitForTimeout(900);

                // Если у карты есть примеры работ — открыть галерею.
                const workBtn = page.locator('#workBtn');
                if (await workBtn.isVisible().catch(() => false)) {
                  await workBtn.click().catch(() => {});
                  await page.waitForTimeout(1200);
                }

                await page.waitForTimeout(1200);

                await page.close();
                await context.close();
                const videoPath = await page.video().path();
                const rawOut = path.join('raw', `karta-${num}.webm`);
                fs.renameSync(videoPath, rawOut);
                console.log('записано:', rawOut);
                ok++;
              } catch (e) {
                console.error('ОШИБКА на карте', num, ':', e.message);
                fail++;
              }
            }

            await browser.close();
            console.log('готово: успех', ok, ', ошибок', fail);
            if (ok === 0) process.exit(1);
          })().catch((e) => { console.error('ОШИБКА:', e.message); process.exit(1); });
          EOF
          node record.js

      - name: Сконвертировать в mp4
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          for f in raw/*.webm; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .webm)
            ffmpeg -y -loglevel error -i "$f" -c:v libx264 -pix_fmt yuv420p -crf 20 -preset veryfast "mp4/$base.mp4"
          done
          echo "всего mp4: $(ls mp4/*.mp4 2>/dev/null | wc -l)"
          du -sh mp4/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: card-screencasts
          path: mp4/
          retention-days: 30
