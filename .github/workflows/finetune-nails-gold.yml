name: Дообучить на ручной разметке

# Правит готовую модель по 26 кадрам, обведённым руками (ml/finetune.py).
#
# Чем отличается от train-nails-clean.yml:
#   1. Не с нуля. init_checkpoint явно задаёт исходные веса; по умолчанию
#      это подтверждённый best-gold-512-shipped.pt. Если asset отсутствует,
#      запуск останавливается: подмена исходной модели недопустима.
#   2. Проверка идёт по 13 отложенным ручным кадрам и считает, сколько
#      ЭТАЛОННЫХ ногтей найдено, а не IoU против автоматических масок.
#      Исключение — режим all_gold: там в обучение идут все 39 кадров, и
#      отложенных не остаётся. Он нужен для финальной сборки, когда рецепт
#      уже проверен; цифры проверки в этом режиме ничего не значат, а веса
#      берутся с эпохи save_at — той, что оказалась лучшей на отложенных.
#   3. Данных два набора: автоматический (колода + CC0) и ручной. Ручной
#      повторяется в эпохе столько раз, чтобы примеров стало поровну, иначе
#      верные кадры утонули бы в приблизительных.
#   4. Часть «контроль» (снимки из открытых источников) с 8 сентября 2026
#      года в обучение НЕ идёт: см. ml/PROVENANCE.md. Вернуть её можно
#      входом with_control — он оставлен, чтобы можно было повторить старый
#      замер, а не потому, что так надо делать.
#   5. zoom включает наезд камерой (train.zoom_pair): часть кадров обрезается
#      вокруг ногтя, и модель видит макро-план, которого в колоде нет.
#      nude делает часть ногтей на кадре голыми (synth.nude): в наборе почти
#      все ногти накрашены, и модель научилась искать лак, а не пластину.
#   6. size задаёт сторону входа. Замер 6 сентября: ноготь крупнее 400 px на
#      входе находится в 95% случаев, мельче 200 px — в 67%, и мелкие дают
#      почти все потери. При 512 тот же ноготь получает в 1.78 раза больше
#      пикселей. ВАЖНО: то же число зашито в Kotlin-плагине (INPUT_SIZE).
on:
  workflow_dispatch:
    inputs:
      init_checkpoint:
        description: 'Точное имя исходного .pt asset (без пути); отсутствие — ошибка'
        required: true
        default: 'best-gold-512-shipped.pt'
      epochs:
        description: 'Сколько эпох (по умолчанию 60)'
        required: false
        default: '60'
      gold_only:
        description: 'Учиться только на ручных кадрах (yes/no)'
        required: false
        default: 'no'
      all_gold:
        description: 'Взять в обучение ВСЕ ручные кадры, отложенных не будет (yes/no)'
        required: false
        default: 'no'
      save_at:
        description: 'Дополнительно сохранить веса на этой эпохе (0 — не надо)'
        required: false
        default: '0'
      size:
        description: 'Сторона входа модели (384, 512 или 576); исходные веса задаются отдельно'
        required: false
        default: '384'
      zoom:
        description: 'Доля кадров с наездом камерой (0 — как было, 0.35 — макро)'
        required: false
        default: '0'
      texture:
        description: 'Доля кадров с узором внутри маски (0 — как в сборке)'
        required: false
        default: '0'
      nude:
        description: 'Доля кадров, где часть ногтей делается голыми (0.25 — лечит «идёт за лаком»)'
        required: false
        default: '0'
      cc0:
        description: 'Добавить в обучение размеченные CC0-кадры из ml/labels5 (yes/no)'
        required: false
        default: 'no'
      own:
        description: 'Добавить в обучение снимки владельца из кабинета (yes/no)'
        required: false
        default: 'no'
      with_control:
        description: 'Взять в обучение часть «контроль» — чужие снимки (yes/no)'
        required: false
        default: 'no'

jobs:
  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      REPO: ugadaynet-prog/mani-magic-rustore
      RELEASE_TAG: try-on-v2
      INIT_CHECKPOINT: ${{ inputs.init_checkpoint }}
      WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
    defaults:
      run:
        working-directory: rustore-app/ml
    steps:
      - uses: actions/checkout@v4
        with:
          path: rustore-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Зафиксировать параметры эксперимента
        run: |
          python3 - <<'EOF'
          import json, os, re
          from pathlib import Path
          name = os.environ['INIT_CHECKPOINT']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*\.pt', name):
              raise SystemExit('init_checkpoint: ожидается безопасное имя .pt asset без пути')
          config = dict(schema_version=1, inputs=json.loads(os.environ['WORKFLOW_INPUTS']),
                        run_id=os.environ['GITHUB_RUN_ID'],
                        run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        git_sha=os.environ['GITHUB_SHA'], init_checkpoint=name,
                        source_release=os.environ['RELEASE_TAG'],
                        release_publish=False)
          Path('run-config.json').write_text(json.dumps(config, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('evaluation_status.json').write_text(json.dumps(dict(
              status='not_run', approved_for_deployment=False,
              reason='Обучение и экспорт ещё не завершены'), ensure_ascii=False, indent=2), encoding='utf-8')
          EOF

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow opencv-python-headless onnx onnxruntime onnxscript

      # Оба набора лежат в релизе зашифрованными одним ключом: репозиторий
      # публичный, а внутри — фотографии приложения и снимки владельца.
      - name: Забрать наборы из Release и расшифровать
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DECK_KEY: ${{ secrets.DECK_KEY }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          tok = os.environ['GH_TOKEN']
          url = f"https://api.github.com/repos/{os.environ['REPO']}/releases/tags/{os.environ['RELEASE_TAG']}"
          req = urllib.request.Request(url, headers={'Authorization': f'token {tok}'})
          rel = json.load(urllib.request.urlopen(req))
          checkpoint = os.environ['INIT_CHECKPOINT']
          want = {'deck-dataset.zip.enc', 'gold-dataset.zip.enc', checkpoint}
          got = set()
          for a in rel.get('assets', []):
              if a['name'] not in want:
                  continue
              print(f"Беру {a['name']} ({a['size']/1e6:.1f} МБ)")
              r = urllib.request.Request(a['url'], headers={
                  'Authorization': f'token {tok}',
                  'Accept': 'application/octet-stream'})
              with urllib.request.urlopen(r) as src, open(a['name'], 'wb') as out:
                  out.write(src.read())
              got.add(a['name'])
          missing = want - got
          if missing:
              raise SystemExit(f'В релизе нет: {", ".join(sorted(missing))}')
          with open(checkpoint, 'rb') as src:
              digest = hashlib.file_digest(src, 'sha256').hexdigest()
          print(f'Исходные веса: {checkpoint}; SHA-256: {digest}')
          shipped_sha256 = '9d310b081061580b448c432df0dd91ef7b97ae832f313891efed7ec568d25c14'
          if checkpoint == 'best-gold-512-shipped.pt' and digest != shipped_sha256:
              raise SystemExit('SHA-256 канонического shipped-checkpoint не совпадает; обучение запрещено')
          config_path = Path('run-config.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['init_sha256'] = digest
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2), encoding='utf-8')
          EOF

          if [ -z "$DECK_KEY" ]; then
            echo "::error::Секрет DECK_KEY пуст — расшифровать нечем."
            exit 1
          fi
          for f in deck-dataset gold-dataset; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in "$f.zip.enc" -out "$f.zip" -pass env:DECK_KEY
            echo "Расшифровано $f.zip: $(stat -c%s "$f.zip") байт"
          done
          python3 -c "import zipfile; zipfile.ZipFile('gold-dataset.zip').extractall('.')"
          echo "Ручных кадров: $(ls dataset_gold/images | wc -l)"

      # CC0-кадры лежат в самом репозитории: права на них отданы явно, шифровать
      # нечего. Поэтому они добавляются к уже распакованному набору, а не
      # приезжают вместе с ним.
      - name: Добавить CC0-кадры в обучение
        if: github.event.inputs.cc0 == 'yes'
        run: python add_cc0.py

      # Снимки владельца — руки клиенток, в открытом репозитории им не место.
      # Они лежат в релизе зашифрованными отдельным ключом OWN_KEY (свой, а не
      # DECK_KEY: тот живёт только в секретах, и перешифровать им новый набор
      # было нечем). Ключ потерять не страшно: оригиналы у владельца, проще
      # сгенерировать новый и перешифровать.
      - name: Добавить снимки владельца в обучение
        if: github.event.inputs.own == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWN_KEY: ${{ secrets.OWN_KEY }}
        run: |
          if [ -z "$OWN_KEY" ]; then
            echo "::error::Секрет OWN_KEY пуст — расшифровать снимки владельца нечем."
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, urllib.request
          tok = os.environ['GH_TOKEN']
          url = f"https://api.github.com/repos/{os.environ['REPO']}/releases/tags/{os.environ['RELEASE_TAG']}"
          rel = json.load(urllib.request.urlopen(urllib.request.Request(
              url, headers={'Authorization': f'token {tok}'})))
          a = next(x for x in rel['assets'] if x['name'] == 'own-dataset.zip.enc')
          r = urllib.request.Request(a['url'], headers={
              'Authorization': f'token {tok}', 'Accept': 'application/octet-stream'})
          with urllib.request.urlopen(r) as src, open('own-dataset.zip.enc', 'wb') as out:
              out.write(src.read())
          print('Беру own-dataset.zip.enc', a['size'], 'байт')
          EOF
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in own-dataset.zip.enc -out own-dataset.zip -pass env:OWN_KEY
          python3 -c "import zipfile; zipfile.ZipFile('own-dataset.zip').extractall('.')"
          python add_cc0.py --src own --prefix own- --tag own

      - name: Собрать автоматический набор
        run: python prepare_clean.py

      # SIZE управляет и обучением, и экспортом: они обязаны совпадать, иначе
      # ONNX получит не тот вход, что видела сеть.
      - name: Дообучить
        env:
          SIZE: ${{ github.event.inputs.size }}
          ZOOM_P: ${{ github.event.inputs.zoom }}
          TEXTURE_P: ${{ github.event.inputs.texture }}
          NUDE_P: ${{ github.event.inputs.nude }}
          EPOCHS: ${{ inputs.epochs }}
          SAVE_AT: ${{ inputs.save_at }}
          GOLD_ONLY: ${{ inputs.gold_only }}
          ALL_GOLD: ${{ inputs.all_gold }}
          WITH_CONTROL: ${{ inputs.with_control }}
        run: |
          test -f "$INIT_CHECKPOINT"
          echo "Стартовые веса: $INIT_CHECKPOINT"
          FLAGS=()
          if [ "$GOLD_ONLY" = "yes" ]; then FLAGS+=(--no-auto); fi
          if [ "$ALL_GOLD" = "yes" ]; then FLAGS+=(--all-gold); fi
          if [ "$WITH_CONTROL" = "yes" ]; then FLAGS+=(--with-control); fi
          python finetune.py \
            --init "$INIT_CHECKPOINT" \
            --epochs "$EPOCHS" \
            --out best-gold.pt \
            --save-at "$SAVE_AT" "${FLAGS[@]}"

      # export.py читает best.pt — подставляем дообученные веса под этим именем.
      # При all_gold «лучшая» эпоха выбиралась бы по кадрам, которые модель
      # видела, — такой отбор ничего не значит. Берём веса с той эпохи, что
      # оказалась лучшей в прогоне с отложенными кадрами.
      - name: Экспорт в ONNX
        env:
          SIZE: ${{ github.event.inputs.size }}
          SAVE_AT: ${{ inputs.save_at }}
          ALL_GOLD: ${{ inputs.all_gold }}
        run: |
          SRC=best-gold.pt
          E="best-gold-e${SAVE_AT}.pt"
          if [ "$ALL_GOLD" = "yes" ]; then
            test -f "$E" || { echo "::error::Для all_gold необходим сохранённый checkpoint эпохи save_at: $E"; exit 1; }
            SRC="$E"
          fi
          echo "Экспортирую $SRC"
          export EXPORT_CHECKPOINT="$SRC"
          python3 - <<'EOF'
          import hashlib, json, os
          from pathlib import Path
          path = Path('run-config.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          config['export_checkpoint'] = os.environ['EXPORT_CHECKPOINT']
          with open(config['export_checkpoint'], 'rb') as src:
              config['export_checkpoint_sha256'] = hashlib.file_digest(src, 'sha256').hexdigest()
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2), encoding='utf-8')
          EOF
          cp "$SRC" best.pt
          python export.py
          mv nail-unet.onnx nail-unet-gold.onnx

      # Фото пяти экзаменов намеренно не публикуются в Git. Отсутствие фото
      # отмечается как unavailable, а не как успешная проверка. Ошибка при
      # наличии полного набора делает шаг красным; артефакт всё равно сохраним.
      - name: Проверить доступность и выполнить пять экзаменов
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          from pathlib import Path
          status_path = Path('evaluation_status.json')
          status = dict(status='running', pipeline='android',
                        approved_for_deployment=False,
                        required_slices=['контроль', 'подборка', 'студия', 'без лака', 'свои'])
          try:
              import benchmark
              try:
                  manifest, dataset_sha = benchmark.dataset_manifest()
              except FileNotFoundError as exc:
                  status.update(status='unavailable', reason=f'Нет полного приватного набора: {exc}')
                  print('::warning::Пять экзаменов недоступны. Кандидат требует полной локальной проверки.')
              else:
                  status['dataset_sha256'] = dataset_sha
                  status['frames'] = len(manifest)
                  subprocess.run([sys.executable, 'benchmark.py', '--model', 'nail-unet-gold.onnx',
                                  '--out', 'benchmark-result', '--pipeline', 'android', '--threads', '2'],
                                 check=True)
                  report = json.loads(Path('benchmark-result/benchmark.json').read_text(encoding='utf-8'))
                  if report.get('complete') is not True:
                      raise RuntimeError('benchmark.py не подтвердил завершение всех пяти экзаменов')
                  status.update(status='completed', model_sha256=report['models'][0]['sha256'],
                                reason='Замер завершён; принятие требует сравнения с рабочей моделью')
          except Exception as exc:
              status.update(status='failed', reason=f'{type(exc).__name__}: {exc}')
              raise
          finally:
              status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'### Проверка модели: {status["status"]}\n\n')
                  summary.write(status.get('reason', '') + '\n\n')
                  summary.write('Экспериментальный артефакт. Автоматическая публикация в Release отключена.\n')
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nail-model-gold-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rustore-app/ml/nail-unet-gold.onnx
            rustore-app/ml/best-gold.pt
            rustore-app/ml/best-gold-e*.pt
            rustore-app/ml/metrics-gold.json
            rustore-app/ml/dataset_gold/split.json
            rustore-app/ml/run-config.json
            rustore-app/ml/evaluation_status.json
            rustore-app/ml/benchmark-result/benchmark.json
            rustore-app/ml/benchmark-result/comparison.md
          if-no-files-found: warn
