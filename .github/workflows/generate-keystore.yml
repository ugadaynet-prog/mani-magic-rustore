name: Generate signing keystore (run ONCE)

# Запускать вручную ОДИН раз — создаёт ключ подписи приложения. Скачайте результат
# и сохраните навсегда (без него нельзя будет выпускать обновления приложения).
# После этого: base64 от .keystore → секрет репозитория ANDROID_KEYSTORE_BASE64,
# пароли → секреты ANDROID_KEYSTORE_PASSWORD и ANDROID_KEY_PASSWORD.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (даёт keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Сгенерировать ключ
        run: |
          keytool -genkeypair -v \
            -keystore mani-magic-rustore.keystore \
            -alias manimagic \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.run_id }}TempPass!" \
            -keypass "${{ github.run_id }}TempPass!" \
            -dname "CN=MANI Magic, OU=ИП Икромова Е.И., O=MANI Magic, L=Moscow, ST=Moscow, C=RU"
          base64 -w0 mani-magic-rustore.keystore > mani-magic-rustore.keystore.base64
          echo "Пароль (сохраните вместе с файлом!): ${{ github.run_id }}TempPass!" > password.txt

      - name: Загрузить результат
        uses: actions/upload-artifact@v4
        with:
          name: rustore-signing-keystore
          path: |
            mani-magic-rustore.keystore
            mani-magic-rustore.keystore.base64
            password.txt
          retention-days: 7
