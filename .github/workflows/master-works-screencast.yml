name: Скринкаст «Витрина работ» (для 6-й серии мультсериала)

# Записывает вертикальное видео (9:16) того, как клиентка в режиме мастера
# открывает витрину работ: плашка мастера → кнопка «Работы» → галерея →
# лайтбокс с одной работой.
#
# Зачем отдельный воркфлоу, а не card-screencasts.yml: тот ходит по ?card=N,
# здесь нужен режим мастера (?master=slug) и совсем другая последовательность
# кликов.
#
# ВАЖНО про содержимое: в 6-й серии Seedance нарисовала на экране телефона
# «галерею работ» — вышли кисти с тремя пальцами и что-то похожее на ступни.
# Это ровно то, от чего защищает «правило рук» из контент-плана §2: руки
# крупным планом не генерируются никогда. Поэтому экран в ролике снимается
# нечитаемым, а сюда вставляется НАСТОЯЩИЙ интерфейс с реальными фото работ.
#
# Грабли, унаследованные от card-screencasts.yml (не переоткрывать заново):
#  1. Пишем в НАТИВНОМ размере телефона 360×640 и растягиваем ffmpeg'ом.
#     recordVideo.size больше viewport кладёт маленький кадр в угол серого холста.
#  2. Блокируем sw.js — иначе service worker при первой установке дёргает
#     controllerchange, страница сама себя перезагружает ПОСЕРЕДИНЕ записи.
#  3. Блокируем mc.yandex — чтобы автопрогоны не летели в боевую Метрику.

on:
  workflow_dispatch:
    inputs:
      master:
        description: 'Slug мастера, чью витрину записываем'
        required: false
        default: 'm-c31a6b9b'

jobs:
  screencast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить Playwright с Chromium
        run: |
          npm init -y >/dev/null
          npm i -D playwright@latest >/dev/null
          npx playwright install chromium --with-deps

      - name: Записать витрину работ
        env:
          MASTER_SLUG: ${{ inputs.master }}
        run: |
          mkdir -p raw mp4
          cat > record.js <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const SLUG = process.env.MASTER_SLUG || 'm-c31a6b9b';
          const BASE = 'https://mani-magic.ru/app/';

          (async () => {
            const browser = await chromium.launch();

            async function attempt() {
              const context = await browser.newContext({
                viewport: { width: 360, height: 640 },
                deviceScaleFactor: 3,
                isMobile: true,
                hasTouch: true,
                recordVideo: { dir: 'raw' },
              });
              await context.route(/mc\.yandex\./, (route) => route.abort());
              await context.route(/\/sw\.js(\?|$)/, (route) => route.abort());

              const page = await context.newPage();
              let ok = false;
              try {
                await page.goto(BASE + '?master=' + SLUG, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForSelector('#splash', { state: 'detached', timeout: 20000 });
                await page.waitForTimeout(1200);

                // Кнопка «Работы» живёт в плашке мастера. Ищем по тексту, а не по
                // id: разметку плашки правили несколько раз, текст стабильнее.
                const worksBtn = page.getByRole('button', { name: /Работы/i }).first();
                await worksBtn.waitFor({ state: 'visible', timeout: 15000 });
                await page.waitForTimeout(600);
                await worksBtn.click();

                // Галерея работ
                await page.waitForSelector('#masterWorksOverlay', { state: 'visible', timeout: 15000 });
                await page.waitForTimeout(1800);

                // Пролистать сетку, чтобы было видно, что работ несколько
                await page.mouse.wheel(0, 260);
                await page.waitForTimeout(1200);
                await page.mouse.wheel(0, -260);
                await page.waitForTimeout(800);

                // Открыть одну работу крупно (лайтбокс)
                const firstPhoto = page.locator('#masterWorksOverlay img').first();
                if (await firstPhoto.isVisible().catch(() => false)) {
                  await firstPhoto.click().catch(() => {});
                  await page.waitForTimeout(2200);
                }

                await page.waitForTimeout(800);
                ok = true;
              } catch (e) {
                console.error('  попытка не удалась:', e.message);
              }

              await page.close().catch(() => {});
              await context.close().catch(() => {});

              const video = page.video();
              const videoPath = video ? await video.path().catch(() => null) : null;
              if (ok && videoPath) {
                fs.renameSync(videoPath, path.join('raw', 'vitrina.webm'));
                return true;
              }
              // Осиротевший файл неудачной попытки удаляем — иначе он уедет
              // в артефакт под служебным именем и выдаст себя за результат.
              if (videoPath) { try { fs.unlinkSync(videoPath); } catch (e) {} }
              return false;
            }

            let done = false;
            for (let a = 1; a <= 3 && !done; a++) {
              if (a > 1) { console.log('повтор', a, 'из 3...'); await new Promise((r) => setTimeout(r, 5000 * a)); }
              done = await attempt();
            }
            await browser.close();
            if (!done) { console.error('ОШИБКА: не записалось после 3 попыток'); process.exit(1); }
            console.log('записано: raw/vitrina.webm');
          })().catch((e) => { console.error('ОШИБКА:', e.message); process.exit(1); });
          EOF
          node record.js

      - name: Сконвертировать в mp4 1080×1920
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -y -loglevel error -i raw/vitrina.webm \
            -vf "scale=1080:1920:flags=lanczos" \
            -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast \
            mp4/Скринкаст-6-витрина-работ.mp4
          ls -la mp4/
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 mp4/*.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-works-screencast
          path: mp4/
          retention-days: 30
