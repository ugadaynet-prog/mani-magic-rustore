name: Label our own nail photos

# Разметка 245 работ колоды масками ногтей. Отдельно от обучения: разметку
# смотрят глазами и принимают решением, а не гоняют вслепую перед каждым
# обучением.
on:
  workflow_dispatch:
    inputs:
      tol:
        description: 'Допуск по цвету (по умолчанию 60)'
        required: false
        default: '60'
      limit:
        description: 'Ограничить числом работ (0 — все)'
        required: false
        default: '0'

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rustore-app/ml
    steps:
      # Две папки рядом — та же схема, что у сборки .aab: фото работ и data.js
      # живут в ДРУГОМ репозитории (mani-magic), и pseudo.py ищет их в ../../app.
      - uses: actions/checkout@v4
        with:
          path: rustore-app

      - uses: actions/checkout@v4
        with:
          repository: ugadaynet-prog/mani-magic
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # mediapipe тянет за собой нативную библиотеку, которой нужен OpenGL.
      # На голом раннере его нет, и падение происходит не при установке, а при
      # первом создании детектора: OSError libEGL.so.1.
      - name: Системные библиотеки для mediapipe
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libgl1 libopengl0 libglib2.0-0 libgomp1

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow scipy mediapipe

      # Ставить недостающие библиотеки по одной за прогон — долгая игра: каждая
      # следующая обнаруживается только на следующем запуске. ldd показывает
      # весь список сразу, поэтому диагностика идёт ДО первого использования.
      - name: Проверить, что нативная часть mediapipe грузится
        run: |
          LIB=$(python -c "import mediapipe, os, glob; print(glob.glob(os.path.join(os.path.dirname(mediapipe.__file__), '**', '*.so'), recursive=True)[0])")
          echo "библиотека: $LIB"
          ldd "$LIB" | grep -i "not found" && echo "ВЫШЕ — чего не хватает" || echo "все зависимости на месте"

      - name: Скачать детектор кисти
        run: |
          curl -sSL -o data/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -la data/hand_landmarker.task

      - name: Разметить
        run: python pseudo.py --tol ${{ github.event.inputs.tol }} --limit ${{ github.event.inputs.limit }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pseudo-labels
          path: |
            rustore-app/ml/data/ours.zip
            rustore-app/ml/pseudo.png
          if-no-files-found: warn
