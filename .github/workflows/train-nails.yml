name: Train nail segmentation

# Только вручную. Обучение не имеет отношения к сборке приложения и не должно
# запускаться от каждого пуша — иначе оно будет драться за очередь с .aab.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Сколько эпох (по умолчанию 260)'
        required: false
        default: '260'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: rustore-app/ml
    steps:
      - uses: actions/checkout@v4
        with:
          path: rustore-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Колёса под CPU: обычный torch тянет драйверы CUDA на два гигабайта,
      # а видеокарты в раннере всё равно нет.
      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow onnx onnxruntime

      - name: Подготовить данные
        run: python prepare.py

      - name: Обучить
        env:
          EPOCHS: ${{ github.event.inputs.epochs }}
        run: python train.py

      - name: Экспорт в ONNX
        run: python export.py

      - uses: actions/upload-artifact@v4
        with:
          name: nail-model
          path: |
            rustore-app/ml/nail-unet.onnx
            rustore-app/ml/metrics.json
          if-no-files-found: error
