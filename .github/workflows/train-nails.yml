name: Train nail segmentation

# Только вручную. Обучение не имеет отношения к сборке приложения и не должно
# запускаться от каждого пуша — иначе оно будет драться за очередь с .aab.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Сколько эпох (по умолчанию 150)'
        required: false
        default: '150'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: rustore-app/ml
    steps:
      - uses: actions/checkout@v4
        with:
          path: rustore-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow onnx onnxruntime onnxscript

      - name: Скачать чекпоинт предыдущего обучения
        run: |
          # Если в репозитории есть best.pt и checkpoint.pt — используем их для resume
          if [ -f best.pt ]; then
            echo "Found best.pt in repo — will resume training"
            ls -lh best.pt
          else
            echo "No checkpoint found — training from scratch"
          fi
          if [ -f checkpoint.pt ]; then
            echo "Found checkpoint.pt in repo"
            ls -lh checkpoint.pt
          fi

      - name: Подготовить данные
        run: python prepare.py

      - name: Обучить
        env:
          EPOCHS: ${{ github.event.inputs.epochs }}
        run: python train.py

      - name: Экспорт в ONNX
        run: python export.py
        continue-on-error: true

      - name: Сохранить обновлённый чекпоинт в репозиторий
        if: success()
        run: |
          # Configure git
          cd /home/runner/work/mani-magic-rustore/mani-magic-rustore/rustore-app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Copy checkpoint files back to ml/
          if [ -f ml/best.pt ]; then
            cp ml/best.pt ml/best.pt
          fi
          if [ -f ml/checkpoint.pt ]; then
            cp ml/checkpoint.pt ml/checkpoint.pt
          fi
          
          git add ml/best.pt ml/checkpoint.pt ml/metrics.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update checkpoint after training [skip ci]"
            git push
            echo "Checkpoint pushed to repo"
          fi

      # Сохраняем ДАЖЕ если экспорт упал
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nail-model
          path: |
            rustore-app/ml/nail-unet.onnx
            rustore-app/ml/metrics.json
            rustore-app/ml/best.pt
            rustore-app/ml/checkpoint.pt
          if-no-files-found: warn
