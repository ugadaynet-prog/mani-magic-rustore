name: Train nail segmentation

# Только вручную. Обучение не имеет отношения к сборке приложения и не должно
# запускаться от каждого пуша — иначе оно будет драться за очередь с .aab.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Сколько эпох (по умолчанию 150)'
        required: false
        default: '150'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: rustore-app/ml
    steps:
      - uses: actions/checkout@v4
        with:
          path: rustore-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow onnx onnxruntime onnxscript

      - name: Подготовить данные
        run: python prepare.py

      - name: Обучить
        env:
          EPOCHS: ${{ github.event.inputs.epochs }}
        run: python train.py

      - name: Экспорт в ONNX
        run: python export.py
        continue-on-error: true

      # Сохраняем ДАЖЕ если экспорт упал: обучение стоит минуты, и терять его
      # из-за последнего шага незачем — веса в best.pt уже лежат.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nail-model
          path: |
            rustore-app/ml/nail-unet.onnx
            rustore-app/ml/metrics.json
            rustore-app/ml/best.pt
            rustore-app/ml/checkpoint.pt
          if-no-files-found: warn
