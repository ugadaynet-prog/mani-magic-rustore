name: Train nail segmentation

# Только вручную. Обучение не имеет отношения к сборке приложения.
# Чекпоинты (best.pt, checkpoint.pt) сохраняются в Release "try-on-v2"
# чтобы следующий запуск мог корректно возобновиться с места остановки.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Сколько эпох (по умолчанию 150)'
        required: false
        default: '150'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rustore-app/ml
    steps:
      - uses: actions/checkout@v4
        with:
          path: rustore-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow onnx onnxruntime onnxscript

      - name: Скачать чекпоинт из Release
        run: |
          echo "Downloading checkpoint from Release assets..."
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ugadaynet-prog/mani-magic-rustore/releases/tags/try-on-v2" \
            -o release.json
          
          python3 << 'EOF'
          import json, urllib.request, os
          with open('release.json') as f:
              release = json.load(f)
          for asset in release.get('assets', []):
              if asset['name'] in ('best-v3.pt', 'checkpoint-v3.pt'):
                  local = 'best.pt' if asset['name'] == 'best-v3.pt' else 'checkpoint.pt'
                  print(f"Found {asset['name']} ({asset['size']/1024/1024:.1f} MB)")
                  req = urllib.request.Request(asset['url'])
                  req.add_header('Authorization', 'token ${{ secrets.GITHUB_TOKEN }}')
                  req.add_header('Accept', 'application/octet-stream')
                  with urllib.request.urlopen(req) as r:
                      with open(local, 'wb') as out:
                          out.write(r.read())
                  print(f"Downloaded {local}")
          if not os.path.exists('best.pt') and not os.path.exists('checkpoint.pt'):
              print("No checkpoints found — training from scratch")
          EOF
          
          ls -lh best.pt checkpoint.pt 2>/dev/null || echo "No checkpoints found — training from scratch"

      - name: Подготовить данные
        run: python prepare.py

      - name: Обучить
        env:
          EPOCHS: ${{ github.event.inputs.epochs }}
        run: python train.py

      - name: Экспорт в ONNX
        run: python export.py
        continue-on-error: true

      # ============================================================
      # СОХРАНИТЬ ЧЕКПОИНТЫ В RELEASE (для возобновления обучения)
      # ============================================================
      - name: Сохранить чекпоинты в Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading checkpoints to Release try-on-v2..."
          
          # Получаем ID релиза
          RELEASE_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/ugadaynet-prog/mani-magic-rustore/releases/tags/try-on-v2" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release ID: $RELEASE_ID"
          
          # Функция: удалить старый asset и загрузить новый
          upload_asset() {
            local file="$1"
            local asset_name="$2"
            
            if [ ! -f "$file" ]; then
              echo "  $file not found, skipping"
              return 0
            fi
            
            local size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
            echo "  Uploading $file ($(($size/1024/1024)) MB) as $asset_name..."
            
            # Удалить старый asset с таким же именем
            OLD_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/ugadaynet-prog/mani-magic-rustore/releases/$RELEASE_ID/assets" \
              | python3 -c "
          import sys,json
          for a in json.load(sys.stdin):
              if a['name']=='$asset_name':
                  print(a['id'])
                  break
          ")
            if [ -n "$OLD_ID" ]; then
              echo "    Deleting old $asset_name (id=$OLD_ID)..."
              curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/ugadaynet-prog/mani-magic-rustore/releases/assets/$OLD_ID"
            fi
            
            # Загрузить новый asset
            HTTP_CODE=$(curl -s -o /tmp/upload_resp.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/ugadaynet-prog/mani-magic-rustore/releases/$RELEASE_ID/assets?name=$asset_name")
            
            if [ "$HTTP_CODE" = "201" ]; then
              echo "    ✅ Uploaded $asset_name successfully"
            else
              echo "    ❌ Upload failed (HTTP $HTTP_CODE)"
              cat /tmp/upload_resp.json
            fi
          }
          
          upload_asset "best.pt" "best-v3.pt"
          upload_asset "checkpoint.pt" "checkpoint-v3.pt"
          upload_asset "metrics.json" "metrics-v3.json"
          upload_asset "nail-unet.onnx" "nail-unet-v3.onnx"
          
          echo ""
          echo "=== All checkpoints saved to Release ==="

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nail-model
          path: |
            rustore-app/ml/nail-unet.onnx
            rustore-app/ml/metrics.json
            rustore-app/ml/best.pt
            rustore-app/ml/checkpoint.pt
          if-no-files-found: warn
