name: Train nail segmentation

# Запускается вручную. Продолжает обучение с checkpoint, если он есть.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Сколько эпох (по умолчанию 150)'
        required: false
        default: '150'
      start_epoch:
        description: 'С какой эпохи продолжить (по умолчанию 0 = с нуля)'
        required: false
        default: '0'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: rustore-app/ml
    steps:
      - uses: actions/checkout@v4
        with:
          path: rustore-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow onnx onnxruntime onnxscript

      - name: Скачать checkpoint из ветки model-checkpoints
        continue-on-error: true
        run: |
          echo "Downloading best.pt and checkpoint.pt from model-checkpoints branch..."
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ml/best.pt?ref=model-checkpoints" \
            | python -c "import sys,json,base64; d=json.load(sys.stdin); open('best.pt','wb').write(base64.b64decode(d['content']))" || true
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ml/checkpoint.pt?ref=model-checkpoints" \
            | python -c "import sys,json,base64; d=json.load(sys.stdin); open('checkpoint.pt','wb').write(base64.b64decode(d['content']))" || true
          curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/ml/metrics.json?ref=model-checkpoints" \
            | python -c "import sys,json,base64; d=json.load(sys.stdin); open('metrics.json','w').write(base64.b64decode(d['content']).decode())" || true
          ls -la best.pt checkpoint.pt metrics.json 2>/dev/null || true

      - name: Подготовить данные
        run: python prepare.py

      - name: Обучить (продолжить с checkpoint)
        env:
          EPOCHS: ${{ github.event.inputs.epochs }}
        run: python train.py

      - name: Экспорт в ONNX
        run: python export.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nail-model
          path: |
            rustore-app/ml/nail-unet.onnx
            rustore-app/ml/metrics.json
            rustore-app/ml/best.pt
            rustore-app/ml/checkpoint.pt
          if-no-files-found: warn
