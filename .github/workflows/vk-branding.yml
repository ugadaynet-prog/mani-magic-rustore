name: Оформление VK (аватар и обложка)

# Рендерит оформление сообщества ВКонтакте в точные размеры, которых требует VK.
# Локально это сделать нечем: браузерного движка в рабочей среде нет, а панель
# просмотра не отдаёт файлы на диск. Здесь всё складывается в артефакт сборки.
#
# Что получается:
#   avatar-400.png       — аватар (VK показывает кругом, всё важное внутри круга)
#   cover-1590x400.png   — обложка для компьютера
#   cover-mobile-1080x1920.png — вертикальная «живая» обложка для телефона
#
# Фирменные цвета взяты из app/style.css: фон #0d0d10, текст #f4efe9, акцент #e63950,
# заголовки — Georgia (тот же шрифт, что в приложении).

on:
  workflow_dispatch:

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить Playwright с Chromium
        run: |
          npm init -y >/dev/null
          npm i -D playwright@latest >/dev/null
          npx playwright install chromium --with-deps

      - name: Сверстать и отрендерить
        run: |
          mkdir -p out
          cat > tpl.js <<'TPLEOF'
          const CARD = n => `https://mani-magic.ru/app/assets/cards/front-${n}.webp`;
          const LOGO = 'https://mani-magic.ru/app/assets/icons/icon-512.png';

          const base = `
            <style>
              * { margin:0; padding:0; box-sizing:border-box; }
              body { background:#0d0d10; color:#f4efe9; overflow:hidden;
                     font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
              .serif { font-family: Georgia, "Times New Roman", serif; }
              .card { border-radius:18px; object-fit:cover; box-shadow:0 24px 60px rgba(0,0,0,.65); }
            </style>`;

          // ── Аватар 400x400. VK кадрирует кругом, поэтому логотип уменьшен
          //    до 78% и центрирован — в круг попадает целиком.
          const avatar = `${base}
            <div style="width:400px;height:400px;background:#fff;
                        display:flex;align-items:center;justify-content:center;">
              <img src="${LOGO}" style="width:78%;height:78%;object-fit:contain;">
            </div>`;

          // ── Обложка 1590x400. На телефоне VK обрезает края, поэтому всё
          //    значимое держим в центральной зоне шириной 1196px.
          const cover = `${base}
            <div style="width:1590px;height:400px;position:relative;
                        background:radial-gradient(120% 140% at 78% 50%, #1b1b22 0%, #0d0d10 60%);">
              <div style="position:absolute;left:50%;top:0;transform:translateX(-50%);
                          width:1196px;height:400px;display:flex;align-items:center;">
                <div style="flex:1;padding-right:24px;">
                  <div class="serif" style="font-size:62px;letter-spacing:.14em;line-height:1;">
                    MANI MAGIC
                  </div>
                  <div style="font-size:27px;margin-top:20px;line-height:1.35;max-width:520px;">
                    Не можешь выбрать цвет?<br>
                    <span style="color:#e63950;font-weight:600;">Тряхни колоду.</span>
                  </div>
                  <div style="font-size:17px;margin-top:22px;color:rgba(244,239,233,.6);">
                    49 карт · идеи маникюра · mani-magic.ru
                  </div>
                </div>
                <div style="position:relative;width:470px;height:400px;">
                  <img class="card" src="${CARD('01')}"
                       style="position:absolute;width:186px;height:300px;left:0;top:50px;
                              transform:rotate(-13deg);">
                  <img class="card" src="${CARD('04')}"
                       style="position:absolute;width:196px;height:316px;left:140px;top:38px;
                              transform:rotate(-1deg);z-index:2;">
                  <img class="card" src="${CARD('25')}"
                       style="position:absolute;width:186px;height:300px;left:284px;top:50px;
                              transform:rotate(12deg);">
                </div>
              </div>
            </div>`;

          // ── Вертикальная обложка для телефона 1080x1920.
          const mobile = `${base}
            <div style="width:1080px;height:1920px;position:relative;
                        background:radial-gradient(100% 70% at 50% 32%, #1e1e26 0%, #0d0d10 65%);
                        display:flex;flex-direction:column;align-items:center;
                        justify-content:center;text-align:center;padding:0 70px;">
              <div style="position:relative;width:820px;height:660px;margin-bottom:80px;">
                <img class="card" src="${CARD('01')}"
                     style="position:absolute;width:330px;height:530px;left:20px;top:70px;
                            transform:rotate(-14deg);">
                <img class="card" src="${CARD('04')}"
                     style="position:absolute;width:350px;height:562px;left:235px;top:44px;
                            transform:rotate(0deg);z-index:2;">
                <img class="card" src="${CARD('25')}"
                     style="position:absolute;width:330px;height:530px;left:470px;top:70px;
                            transform:rotate(14deg);">
              </div>
              <div class="serif" style="font-size:96px;letter-spacing:.13em;line-height:1;">
                MANI MAGIC
              </div>
              <div style="font-size:46px;margin-top:44px;line-height:1.4;">
                Не можешь выбрать цвет?<br>
                <span style="color:#e63950;font-weight:600;">Тряхни колоду.</span>
              </div>
              <div style="font-size:30px;margin-top:52px;color:rgba(244,239,233,.55);">
                49 карт · mani-magic.ru
              </div>
            </div>`;

          module.exports = { avatar, cover, mobile };
          TPLEOF

          cat > render.js <<'EOF'
          const { chromium } = require('playwright');
          const t = require('./tpl.js');

          const jobs = [
            { name: 'avatar-400',              html: t.avatar, w: 400,  h: 400  },
            { name: 'cover-1590x400',          html: t.cover,  w: 1590, h: 400  },
            { name: 'cover-mobile-1080x1920',  html: t.mobile, w: 1080, h: 1920 },
          ];

          (async () => {
            const browser = await chromium.launch();
            for (const j of jobs) {
              const page = await browser.newPage({ viewport: { width: j.w, height: j.h } });
              await page.setContent(j.html, { waitUntil: 'load' });
              // дождаться, пока реально догрузятся все картинки — иначе будут дыры
              await page.waitForFunction(
                () => Array.from(document.images).every(i => i.complete && i.naturalWidth > 0),
                { timeout: 30000 }
              );
              await page.waitForTimeout(500);
              await page.screenshot({ path: `out/${j.name}.png` });
              console.log('готово:', j.name, `${j.w}x${j.h}`);
              await page.close();
            }
            await browser.close();
          })().catch(e => { console.error('ОШИБКА:', e.message); process.exit(1); });
          EOF
          node render.js
          echo "--- проверка размеров ---"
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          for f in out/*.png; do identify -format "%f: %wx%h (%[size])\n" "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: vk-branding
          path: out/
          retention-days: 30
